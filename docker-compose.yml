services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: screener
      POSTGRES_PASSWORD: screener
      POSTGRES_DB: screener
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Postgres stays on the Compose network only. Publishing 5432 on the host
    # conflicts with a system PostgreSQL and is not needed by the app.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screener -d screener"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://screener:screener@postgres:5432/screener
    ports:
      - "8000:8000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

volumes:
  postgres_data:
